<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Treasure Secured</title>

    <link
        rel="stylesheet"
        href="./finished.css?v=1"
    >

</head>


<body>

<div class="finish-wrapper">

    <div class="finish-card">

        <div class="finish-symbol">
            🏆
        </div>

        <p class="finish-kicker">
            JOURNEY COMPLETE
        </p>

        <h1>
            Treasure Secured
        </h1>

        <h2 id="finishedTeamName">
            Loading team...
        </h2>


        <div class="finish-divider"></div>


        <p class="finish-message">

            Your team's final checkpoint
            has been successfully recorded.

        </p>


        <div class="finish-stats">

            <div class="finish-stat">

                <small>
                    FINISH TIME
                </small>

                <strong id="finishClock">
                    --:--:--
                </strong>

            </div>


            <div class="finish-stat">

                <small>
                    TOTAL TIME
                </small>

                <strong id="finishDuration">
                    --:--:--
                </strong>

            </div>

        </div>


        <div class="await-box">

            Final rankings will be announced
            after the remaining teams complete
            the hunt.

        </div>


        <p
            id="finishConnection"
            class="finish-small"
        >
            Finish securely recorded.
        </p>

    </div>

</div>


<script src="./finished.js?v=1"></script>

</body>

</html>
