<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stand By | Treasure Hunt</title>

    <link
        rel="stylesheet"
        href="./auth.css?v=2"
    >

</head>


<body>


<div class="background-layer"></div>


<main class="auth-wrapper">


    <section class="parchment-card">


        <div class="ornament">
            ✦ ☠ ✦
        </div>


        <p class="eyebrow">
            YOUR TEAM IS READY
        </p>


        <h1>
            Stand By
        </h1>


        <div
            id="waitingTeamName"
            class="team-badge"
        >
            Loading team...
        </div>


        <p class="quote">
            The gates remain sealed until the
            Hunt Master begins the event.
        </p>


        <div class="divider">
            <span>⌛</span>
        </div>


        <div class="status-pill">

            ✓ Login Verified

        </div>

        <br>

        <div class="status-pill">

            ✓ Camera Verified

        </div>


        <p
            id="waitingStatus"
            style="
                margin-top:25px;
                line-height:1.7;
            "
        >
            Waiting for administrator...
        </p>


        <div
            class="waiting-loader"
        >
            <span></span>
            <span></span>
            <span></span>
        </div>


        <p
            id="waitingMessage"
            class="message"
        ></p>


    </section>


</main>


<script src="./waiting.js?v=1"></script>

</body>

</html>
