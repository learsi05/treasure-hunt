<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Login | Treasure Hunt</title>

    <link rel="stylesheet" href="./auth.css?v=1">
</head>

<body>

<div class="background-layer"></div>


<main class="auth-wrapper">

    <section class="parchment-card">

        <div class="ornament">
            ✦ ☠ ✦
        </div>

        <p class="eyebrow">
            THE GATEWAY TO THE HUNT
        </p>

        <h1>
            Team Login
        </h1>

        <p class="quote">
            “Only those bearing the correct mark may enter.”
        </p>


        <div class="divider">
            <span>⚔</span>
        </div>


        <form
            id="loginForm"
            autocomplete="off"
        >

            <label for="teamName">
                Team Name
            </label>

            <input
                id="teamName"
                name="teamName"
                type="text"
                placeholder="Enter your team name"
                maxlength="50"
                required
            >


            <label for="loginCode">
                Team Login Code
            </label>

            <input
                id="loginCode"
                name="loginCode"
                type="password"
                placeholder="Enter the secret code"
                maxlength="50"
                required
            >


            <button
                id="loginButton"
                type="submit"
            >
                Enter the Hunt
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <p class="warning-text">
            Only the designated team leader should login.
            One active device is allowed per team.
        </p>


        <a
            href="./index.html"
            class="back-link"
        >
            ← Return to the map
        </a>

    </section>

</main>


<script src="./login.js?v=1"></script>

</body>

</html>
