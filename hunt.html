<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Prevent stale event screen -->
    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <title>The Hunt | Treasure Hunt</title>

    <link
        rel="stylesheet"
        href="./auth.css?v=3"
    >
</head>

<body>

<div class="background-layer"></div>

<main class="auth-wrapper">

    <section class="parchment-card">

        <div class="ornament">
            ✦ ☠ ✦
        </div>

        <p class="eyebrow">
            THE HUNT HAS BEGUN
        </p>

        <h1>
            Hunt Active
        </h1>

        <div
            id="huntTeamName"
            class="team-badge"
        >
            Checking team...
        </div>

        <p class="quote">
            Stay alert. Your next clue awaits.
        </p>

        <div class="divider">
            <span>🧭</span>
        </div>

        <div
            id="huntStatus"
            class="status-pill"
        >
            Checking event...
        </div>

        <p
            id="huntMessage"
            style="
                margin-top:20px;
                line-height:1.7;
            "
        >
            Preparing the hunt...
        </p>

    </section>

</main>

<script src="./hunt.js?v=1"></script>

</body>

</html>
