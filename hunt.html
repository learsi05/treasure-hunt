<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Treasure Hunt</title>

    <link
        rel="stylesheet"
        href="./hunt.css?v=4"
    >

</head>


<body>


<div class="hunt-page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="hunt-header">


        <div>

            <small>
                TREASURE HUNT
            </small>


            <h2 id="teamName">
                Loading...
            </h2>

        </div>


        <div
            id="stageLabel"
            class="checkpoint-pill"
        >
            ...
        </div>


    </header>


    <!-- =====================================================
         CURRENT CLUE SCREEN
    ===================================================== -->

    <section
        id="clueScreen"
        class="hunt-card"
    >


        <p class="clue-label">
            CURRENT OBJECTIVE
        </p>


        <h1 id="clueTitle">
            Preparing Hunt...
        </h1>


        <!-- CLUE TEXT -->

        <div
            id="clueText"
            class="clue-box"
        >
            Loading...
        </div>


        <!-- OPTIONAL CLUE IMAGE -->

        <div
            id="clueImageWrapper"
            class="clue-image-wrapper hidden"
        >

            <img
                id="clueImage"
                class="hunt-clue-image"
                alt="Clue image"
            >

        </div>


        <!-- =================================================
             HINT + ANSWER

             hunt.js will dynamically create:
             - locked Hint button
             - Hint countdown
             - revealed Hint
             - locked Answer button
             - Answer countdown
             - revealed Answer
        ================================================= -->

        <div
            id="clueAssistanceMount"
            class="assistance-mount"
        ></div>


        <!-- SCAN BUTTON -->

        <button
            id="scanButton"
            class="scan-button"
            onclick="openScanner()"
        >
            📷 Scan QR
        </button>


    </section>


    <!-- =====================================================
         QR SCANNER
    ===================================================== -->

    <section
        id="scannerScreen"
        class="hunt-card hidden"
    >


        <p class="clue-label">
            QR SCANNER
        </p>


        <h1>
            Scan the Mark
        </h1>


        <p class="scanner-help">

            Point your camera toward the QR code
            and hold the phone steady.

        </p>


        <div
            id="qr-reader"
            class="qr-reader"
        ></div>


        <p
            id="scannerStatus"
            class="scanner-status"
        >
            Point your camera at the QR code.
        </p>


        <button
            class="secondary-button"
            onclick="closeScanner()"
        >
            ← Return to Clue
        </button>


    </section>


    <!-- =====================================================
         QR RESULT / NEW CLUE
    ===================================================== -->

    <section
        id="resultScreen"
        class="hunt-card hidden"
    >


        <div
            id="resultIcon"
            class="result-icon"
        >
            ✓
        </div>


        <h1 id="resultTitle">
            Stage Complete
        </h1>


        <p
            id="resultMessage"
            class="result-message"
        ></p>


        <!-- NEW CLUE AREA -->

        <div
            id="resultClueArea"
            class="result-clue-area"
        >


            <p
                id="newClueLabel"
                class="clue-label"
            >
                YOUR NEXT CLUE
            </p>


            <div
                id="nextClue"
                class="clue-box"
            ></div>


            <!-- OPTIONAL NEW CLUE IMAGE -->

            <div
                id="nextClueImageWrapper"
                class="clue-image-wrapper hidden"
            >

                <img
                    id="nextClueImage"
                    class="hunt-clue-image"
                    alt="Next clue image"
                >

            </div>


            <!--
                Hint / Answer controls for
                the newly revealed clue.

                This is important because the
                5-minute Hint timer starts
                immediately when this clue
                is revealed.
            -->

            <div
                id="resultAssistanceMount"
                class="assistance-mount"
            ></div>


        </div>


        <button
            id="scanNextButton"
            onclick="continueHunt()"
        >
            Continue
        </button>


    </section>


</div>


<!-- =====================================================
     QR SCANNER LIBRARY
===================================================== -->

<script
    src="https://unpkg.com/html5-qrcode"
></script>


<!-- =====================================================
     HUNT SCRIPT
===================================================== -->

<script
    src="./hunt.js?v=5"
></script>


</body>

</html>
