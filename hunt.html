<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Treasure Hunt</title>

    <link
        rel="stylesheet"
        href="./hunt.css?v=3"
    >

</head>


<body>

<div class="hunt-page">


    <header class="hunt-header">

        <div>

            <small>
                TREASURE HUNT
            </small>

            <h2 id="teamName">
                Loading...
            </h2>

        </div>


        <div
            id="stageLabel"
            class="checkpoint-pill"
        >
            ...
        </div>

    </header>


    <!-- CLUE -->

    <section
        id="clueScreen"
        class="hunt-card"
    >

        <p class="clue-label">
            CURRENT OBJECTIVE
        </p>


        <h1 id="clueTitle">
            Preparing Hunt...
        </h1>


        <div
            id="clueText"
            class="clue-box"
        >
            Loading...
        </div>


        <button
            id="scanButton"
            onclick="openScanner()"
        >
            📷 Scan QR
        </button>

    </section>


    <!-- SCANNER -->

    <section
        id="scannerScreen"
        class="hunt-card hidden"
    >

        <p class="clue-label">
            QR SCANNER
        </p>


        <h1>
            Scan the Mark
        </h1>


        <div id="qr-reader"></div>


        <p id="scannerStatus">
            Point your camera at the QR code.
        </p>


        <button
            class="secondary-button"
            onclick="closeScanner()"
        >
            Return to Clue
        </button>

    </section>


    <!-- RESULT -->

    <section
        id="resultScreen"
        class="hunt-card hidden"
    >

        <div
            id="resultIcon"
            class="result-icon"
        >
            ✓
        </div>


        <h1 id="resultTitle">
            Stage Complete
        </h1>


        <p
            id="resultMessage"
            class="result-message"
        ></p>


        <div
            id="nextClue"
            class="clue-box"
        ></div>


        <button
            id="scanNextButton"
            onclick="continueHunt()"
        >
            Continue
        </button>

    </section>


</div>


<script src="https://unpkg.com/html5-qrcode"></script>

<script src="./hunt.js?v=4"></script>

</body>

</html>
