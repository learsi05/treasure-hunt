<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Hunt</title>

    <link
        rel="stylesheet"
        href="./hunt.css?v=1"
    >

</head>


<body>


<div class="hunt-page">


    <header class="hunt-header">

        <div>

            <small>
                TREASURE HUNT
            </small>

            <h2 id="teamName">
                Loading...
            </h2>

        </div>


        <div class="checkpoint-pill">

            CP
            <span id="checkpointNumber">
                -
            </span>
            / 5

        </div>

    </header>


    <!-- CLUE SCREEN -->

    <section
        id="clueScreen"
        class="hunt-card"
    >

        <p class="clue-label">
            CURRENT CLUE
        </p>


        <h1>
            Seek Your Next Mark
        </h1>


        <div
            id="clueText"
            class="clue-box"
        >
            Loading clue...
        </div>


        <button
            id="scanButton"
            onclick="openScanner()"
        >
            📷 Scan QR
        </button>

    </section>


    <!-- SCANNER -->

    <section
        id="scannerScreen"
        class="hunt-card hidden"
    >

        <p class="clue-label">
            QR SCANNER
        </p>


        <h1>
            Find the Mark
        </h1>


        <div
            id="qr-reader"
        ></div>


        <p id="scannerStatus">

            Point the camera at the QR code.

        </p>


        <button
            class="secondary-button"
            onclick="closeScanner()"
        >
            Back to Clue
        </button>

    </section>


    <!-- RESULT -->

    <section
        id="resultScreen"
        class="hunt-card hidden"
    >

        <div
            id="resultIcon"
            class="result-icon"
        >
            ✓
        </div>


        <h1 id="resultTitle">
            Checkpoint Complete
        </h1>


        <p
            id="resultMessage"
            class="result-message"
        ></p>


        <div
            id="nextClue"
            class="clue-box"
        ></div>


        <button
            id="scanNextButton"
            onclick="continueHunt()"
        >
            Scan Next
        </button>

    </section>


</div>


<script
    src="https://unpkg.com/html5-qrcode"
></script>

<script
    src="./hunt.js?v=2"
></script>


</body>

</html>
